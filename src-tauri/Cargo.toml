[package]
name = "karaokedesktop"
version = "1.0.0"
description = "Karaoke Pro – A feature-rich desktop karaoke application with YouTube streaming, Party mode, and more."
authors = ["Duck-dev-05"]
edition = "2021"
license = "MIT"
repository = "https://github.com/Duck-dev-05/karaokedesktop"
homepage = "https://github.com/Duck-dev-05/karaokedesktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "karaokedesktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-dialog = "2"
tauri-plugin-oauth = "2.1.0"
tiny_http = "0.12.0"
reqwest = { version = "0.13.4", features = ["blocking", "stream", "json"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread"] }
youtube_dl = { version = "0.10.0", features = ["downloader-rustls-tls", "tokio"] }
tauri-plugin-fs = "2.5.1"
tauri-plugin-shell = "2"
tauri-plugin-log = "2.9.0"
urlencoding = "2.1.3"
tokio-tungstenite = "0.30.0"
futures-util = "0.3.33"
dotenvy = "0.15.7"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

