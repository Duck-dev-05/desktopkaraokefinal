name: Release

on:
  push:
    tags:
      - 'v*' # Triggers on tags like v0.1.0, v1.2.3, etc.

jobs:
  release:
    permissions:
      contents: write # Needed to create GitHub Releases
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install frontend dependencies
        run: npm install

      - name: Setup sidecars
        run: |
          node -e "const fs = require('fs'); const ffmpeg = require('ffmpeg-static'); fs.copyFileSync(ffmpeg, 'src-tauri/ffmpeg-x86_64-pc-windows-msvc.exe'); console.log('Copied ffmpeg sidecar');"

      - name: Build and release Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing keys for auto-updater
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Your app env vars (add any others your app needs)
          VITE_YOUTUBE_API_KEY: ${{ secrets.VITE_YOUTUBE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        with:
          tagName: ${{ github.ref_name }}        # e.g. v0.1.0
          releaseName: 'Karaoke Pro ${{ github.ref_name }}'
          releaseBody: 'See the assets below to download and install this version.'
          releaseDraft: true   # Set to false to publish immediately
          prerelease: false
          args: ${{ matrix.args }}
